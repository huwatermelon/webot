<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Webot Console</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <i data-lucide="message-square"></i>
        <div>
          <h1>Webot</h1>
          <span>Personal Assistant</span>
        </div>
      </div>
      <div class="service-state">
        <span id="service-dot" class="status-dot"></span>
        <span id="service-label">正在连接</span>
        <code id="runtime-build">读取版本中</code>
      </div>
    </header>
    <div class="toolbar app-toolbar">
      <nav aria-label="管理视图">
        <button class="nav-item active" data-view="cases"><i data-lucide="inbox"></i><span>Case</span></button>
        <button class="nav-item" data-view="overview"><i data-lucide="layout-dashboard"></i><span>概览</span></button>
        <button class="nav-item" data-view="settings"><i data-lucide="settings"></i><span>设置</span></button>
        <button class="nav-item" data-view="release"><i data-lucide="package-check"></i><span>运行</span></button>
      </nav>
      <div class="view-context">
        <span id="view-eyebrow">CASES</span>
        <strong id="view-title">微信 Case</strong>
      </div>
      <div class="top-actions">
        <span class="save-state" id="save-state"></span>
        <button class="button secondary" id="refresh-button" title="刷新状态"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
        <button class="button primary" id="save-button"><i data-lucide="save"></i><span>保存配置</span></button>
      </div>
    </div>
    <main>
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
